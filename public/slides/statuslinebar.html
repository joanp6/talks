<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activando la statusline bar en Claude Cli · Joan</title>
<!--
  Presentación animada de un solo archivo (sin dependencias).
  A la izquierda, una terminal de Claude Code donde se escribe el prompt y Claude implementa
  la status line. A la derecha, la guía que explica cada paso.

  Teclas: → / espacio / clic = siguiente paso (si hay una animación en marcha, la termina)
          ← = escena anterior · R = repetir escena · N = notas · F = pantalla completa
-->
<style>
:root {
  --bg: #1e1e1e; --term: #141414; --panel: #252526; --border: #3c3c3c;
  --text: #d4d4d4; --muted: #8b8b8b; --dim: #5a5a5a;
  --claude: #d97757; --blue: #569cd6; --cyan: #4ec9b0; --ok: #3fb950;
  --yellow: #d7ba7d; --red: #f14c4c; --magenta: #c586c0; --orange: #ce9178;
  --add-bg: rgba(63, 185, 80, .14); --del-bg: rgba(241, 76, 76, .14);
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --ui: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
/* Todo escala con la ventana (proyector, portátil o iframe de la web) */
html { font-size: min(1.05vw, 1.87vh); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--ui); overflow: hidden; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

/* --- Barra superior estilo VS Code --- */
.titlebar { display: flex; align-items: center; gap: 1rem; height: 2.4rem; padding: 0 1rem; background: #181818; border-bottom: 1px solid var(--border); font-size: .85rem; color: var(--muted); }
.titlebar svg { width: 1.1rem; height: 1.1rem; }
.titlebar__tabs { display: flex; gap: 1.5rem; font-family: var(--mono); font-size: .8rem; letter-spacing: .05em; }
.titlebar__tabs span.on { color: var(--text); border-bottom: 1px solid var(--text); padding-bottom: .1rem; }
.titlebar__title { flex: 1; text-align: center; }
.titlebar kbd { font-family: var(--mono); font-size: .7rem; border: 1px solid var(--border); border-radius: 3px; padding: 0 .3rem; margin-left: .25rem; }
.back { color: #fff; background: #0e639c; text-decoration: none; padding: .15rem .6rem; border-radius: 3px; }
.back:hover { background: #1177bb; }

.main { display: grid; grid-template-columns: 1.7fr 1fr; min-height: 0; }

/* --- Terminal de Claude Code --- */
.term { display: flex; flex-direction: column; min-height: 0; background: var(--term); border-right: 1px solid var(--border); font-family: var(--mono); font-size: 1rem; line-height: 1.55; }
/* flex-end: lo nuevo entra por abajo y lo viejo desaparece por arriba, como en una terminal */
.transcript { flex: 1; min-height: 0; overflow: hidden; padding: 1.2rem 1.6rem .6rem; display: flex; flex-direction: column; justify-content: flex-end; }
.transcript > * { flex-shrink: 0; }

.welcome { border: 1px solid var(--claude); border-radius: .4rem; padding: .7rem 1.1rem; margin-bottom: 1.2rem; width: fit-content; white-space: pre-wrap; }
.welcome b { color: var(--claude); }
.welcome .muted { color: var(--muted); }

.msg { margin: .5rem 0; white-space: pre-wrap; }
.msg-user { margin: .9rem 0 .5rem; padding: .25rem .7rem; background: #262626; color: var(--muted); white-space: pre-wrap; border-left: 2px solid var(--dim); }
.msg-user .t { color: var(--text); }
.dot { margin-right: .5rem; }
.dot--w { color: var(--text); } .dot--ok { color: var(--ok); } .dot--claude { color: var(--claude); }
.tool b { color: var(--text); }
.tool .arg { color: var(--muted); }
.result { color: var(--muted); margin: 0 0 .4rem 1.1rem; white-space: pre-wrap; }
.warn { color: var(--yellow); margin: .5rem 0; }

.code { margin: .2rem 0 .4rem 1.1rem; border-left: 1px solid var(--border); padding-left: .8rem; font-size: .88rem; line-height: 1.5; }
.code div { white-space: pre; }
.code .ln { color: var(--dim); display: inline-block; width: 2.2rem; text-align: right; margin-right: .9rem; }
.code .add { background: var(--add-bg); color: #b9e6c0; }
.code .del { background: var(--del-bg); color: #f0b4b4; }
.code .more { color: var(--muted); font-style: italic; }

.spinner { color: var(--claude); margin: .5rem 0; }
.spinner .muted { color: var(--muted); }

/* Caja de entrada */
.input { margin: 0 1.6rem; padding: .55rem 1rem; border: 1px solid var(--dim); border-radius: .4rem; min-height: 2.6rem; white-space: pre-wrap; }
.input::before { content: "> "; color: var(--text); }
.cursor { display: inline-block; width: .55rem; height: 1.05rem; background: var(--text); vertical-align: text-bottom; animation: parpadeo 1s steps(1) infinite; }
@keyframes parpadeo { 50% { opacity: 0; } }

/* Debajo de la caja: atajos o la status line */
.footer { padding: .45rem 2.4rem .9rem; min-height: 4.4rem; white-space: pre; }
.footer .hint { color: var(--muted); }
#statusline { transition: background .4s; border-radius: .3rem; }
#statusline.flash { animation: flash 1s ease; }
@keyframes flash { 0% { background: rgba(86,156,214,.35); } 100% { background: transparent; } }
#statusline.nueva { animation: aparece .8s ease; }
@keyframes aparece { from { opacity: 0; transform: translateY(.5rem); } to { opacity: 1; transform: none; } }
.seg { border-radius: .2rem; transition: box-shadow .25s, background .25s; }
.seg.hl { background: rgba(86,156,214,.25); box-shadow: 0 0 0 2px var(--blue); }

/* Colores tipo ANSI */
.g { color: var(--muted); } .cy { color: var(--cyan); } .ve { color: var(--ok); }
.am { color: var(--yellow); } .ro { color: var(--red); } .ma { color: var(--magenta); }
b.w { color: #fff; }

/* --- Panel de guía --- */
.guide { display: flex; flex-direction: column; padding: 2rem 2.2rem 1.4rem; background: var(--panel); min-height: 0; }
.guide__step { font-family: var(--mono); font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--claude); margin-bottom: .9rem; }
.guide__step::before { content: "── "; color: var(--dim); }
.guide h2 { font-size: 2.1rem; line-height: 1.15; margin: 0 0 1.1rem; font-weight: 600; }
.guide h2 em { font-style: normal; color: var(--claude); }
.guide__body { flex: 1; font-size: 1.15rem; line-height: 1.55; overflow: hidden; }
.guide__body p { margin: 0 0 1rem; }
.guide__body ul { margin: 0 0 1rem; padding-left: 1.2rem; }
.guide__body li { margin-bottom: .45rem; }
.guide__body li.hl { color: #fff; }
.guide__body li.hl::marker { color: var(--blue); }
.guide__body code { font-family: var(--mono); font-size: .92em; color: var(--cyan); }
.guide__body .note { border-left: 3px solid var(--claude); padding: .5rem .9rem; background: rgba(217,119,87,.08); font-size: 1.05rem; }
.guide__enter { animation: entra .4s ease; }
@keyframes entra { from { opacity: 0; transform: translateX(.8rem); } to { opacity: 1; transform: none; } }

.flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: .4rem; margin: .3rem 0 1.2rem; text-align: center; font-size: .95rem; }
.flow div { background: #1b1b1b; border: 1px solid var(--border); border-radius: .4rem; padding: .55rem .3rem; }
.flow div.you { border-color: var(--claude); }
.flow span { color: var(--claude); }
.flow small { display: block; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.map { width: 100%; border-collapse: collapse; font-size: 1rem; }
.map td { padding: .35rem .4rem; border-bottom: 1px solid var(--border); vertical-align: top; }
.map tr.hl td { background: rgba(86,156,214,.15); }
.map td:first-child { color: #fff; white-space: nowrap; }

.guide__foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; font-size: .8rem; color: var(--muted); }
.dots { display: flex; gap: .4rem; }
.dots i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--dim); }
.dots i.on { background: var(--claude); }
.dots i.done { background: var(--muted); }
.next-hint { font-family: var(--mono); }
.next-hint.wait { color: var(--claude); }

/* Notas del presentador (tecla N) */
.notes { position: fixed; left: 1rem; top: 3.2rem; width: 34rem; background: #111; border: 1px solid var(--yellow); border-radius: .4rem; padding: .9rem 1.1rem; font-size: 1rem; line-height: 1.5; z-index: 5; }
.notes b { display: block; font-family: var(--mono); font-size: .75rem; color: var(--yellow); letter-spacing: .1em; margin-bottom: .3rem; }
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M76 8L96 18V82L76 92L32 56L14 70L4 64V36L14 30L32 44L76 8ZM76 28L46 50L76 72V28Z" fill="#007acc"/></svg>
    <a class="back" id="backLink" href="/charlas/statuslinebar/" target="_top">← Volver a la charla</a>
    <div class="titlebar__tabs"><span>PROBLEMS</span><span>OUTPUT</span><span class="on">TERMINAL</span></div>
    <span class="titlebar__title">claude — talks</span>
    <span><kbd>→</kbd> siguiente <kbd>←</kbd> anterior <kbd>R</kbd> repetir <kbd>N</kbd> notas <kbd>F</kbd> pantalla completa</span>
  </header>

  <div class="main">
    <section class="term" id="term">
      <div class="transcript" id="transcript"></div>
      <div class="input" id="input"><span id="inputText"></span><span class="cursor"></span></div>
      <div class="footer"><div id="statusline"></div><div class="hint" id="hint">? for shortcuts</div></div>
    </section>

    <aside class="guide" id="guide">
      <div id="guideContent"></div>
      <div class="guide__foot">
        <div class="dots" id="dots"></div>
        <div class="next-hint" id="nextHint">→ siguiente</div>
      </div>
    </aside>
  </div>
</div>
<div class="notes" id="notes" hidden><b>NOTAS DEL PRESENTADOR</b><span id="notesText"></span></div>

<script>
/* ============================================================
   1. Motor de animación
   - sleep() espera, salvo en "modo rápido" (skipping), que termina al instante.
   - Cambiar de escena incrementa `gen`: las animaciones viejas se cancelan.
   ============================================================ */
const ABORT = Symbol("abort");
let skipping = false;  // true = completar la animación actual sin esperas
let gen = 0;           // generación: cambia al saltar de escena
let pendientes = [];   // esperas en curso (para poder adelantarlas)

function sleep(ms) {
  const g = gen;
  if (skipping) return g === gen ? Promise.resolve() : Promise.reject(ABORT);
  return new Promise((resolve, reject) => {
    const done = () => {
      clearTimeout(t);
      pendientes = pendientes.filter((f) => f !== done);
      g === gen ? resolve() : reject(ABORT);
    };
    const t = setTimeout(done, ms);
    pendientes.push(done);
  });
}

function adelantar() {          // termina ya la animación en curso
  skipping = true;
  pendientes.slice().forEach((f) => f());
}

/* ============================================================
   2. Piezas de la terminal
   ============================================================ */
const $ = (id) => document.getElementById(id);
const transcript = $("transcript");
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function add(cls, html) {
  const e = document.createElement("div");
  e.className = cls;
  e.innerHTML = html;
  transcript.appendChild(e);
  return e;
}

async function escribirPrompt(texto, velocidad = 32) {
  const el = $("inputText");
  el.textContent = "";
  if (skipping) { el.textContent = texto; return; }
  for (const ch of texto) {
    el.textContent += ch;
    await sleep(velocidad + Math.random() * 25);
  }
  await sleep(450);
}

async function enviar() {
  const texto = $("inputText").textContent;
  $("inputText").textContent = "";
  add("msg-user", `&gt; <span class="t">${esc(texto)}</span>`);
  await sleep(350);
}

const FRAMES = ["·", "✢", "✳", "✶", "✻", "✽", "✻", "✶", "✳", "✢"];
async function pensar(ms, etiqueta = "Pensando…") {
  const e = add("spinner", "");
  const inicio = Date.now();
  let i = 0;
  try {
    while (!skipping && Date.now() - inicio < ms) {
      const seg = Math.floor((Date.now() - inicio) / 1000);
      e.innerHTML = `${FRAMES[i++ % FRAMES.length]} ${etiqueta} <span class="muted">(${seg}s · esc to interrupt)</span>`;
      await sleep(110);
    }
  } finally {
    e.remove();
  }
}

async function dice(html) {
  add("msg", `<span class="dot dot--w">●</span>${html}`);
  await sleep(600);
}

// Una llamada a herramienta: ● Write(ruta), un bloque de código opcional y ⎿ resultado
async function herramienta(nombre, arg, resultado, lineas = null, mas = null) {
  add("msg tool", `<span class="dot dot--ok">●</span><b>${nombre}</b><span class="arg">(${esc(arg)})</span>`);
  await sleep(400);
  if (lineas) {
    const bloque = add("code", "");
    for (const [tipo, num, texto] of lineas) {
      const d = document.createElement("div");
      if (tipo) d.className = tipo;
      const signo = tipo === "add" ? "+" : tipo === "del" ? "-" : " ";
      d.innerHTML = `<span class="ln">${num ?? ""}</span>${signo} ${esc(texto)}`;
      bloque.appendChild(d);
      await sleep(70);
    }
    if (mas) {
      const d = document.createElement("div");
      d.className = "more";
      d.textContent = mas;
      bloque.appendChild(d);
    }
  }
  add("result", `⎿  ${resultado}`);
  await sleep(600);
}

/* --- Status line (mismo formato que ~/.claude/statusline.js) --- */
let st = null; // null = todavía no hay status line

function color(p) { return p >= 80 ? "ro" : p >= 50 ? "am" : "ve"; }
function barra(p) {
  const n = Math.round(p / 10), c = color(p);
  return `<span class="g">[</span><span class="${c}">${"█".repeat(n)}</span><span class="g">${"░".repeat(10 - n)}]</span> <span class="${c}">${p}%</span>`;
}
const seg = (id, html) => `<span class="seg" data-seg="${id}">${html}</span>`;
const SEP = ` <span class="g">|</span> `;

function pintarStatus(efecto) {
  const el = $("statusline");
  $("hint").hidden = !!st; // con status line, Claude Code oculta casi todos los atajos
  if (!st) { el.innerHTML = ""; return; }
  const l1 = [
    seg("carpeta", `<b class="w">talks</b>`),
    seg("rama", `<span class="ve">main</span>`),
    seg("modelo", `<span class="cy">Opus</span>`),
    seg("ctx", `<span class="g">ctx:</span>${barra(st.ctx)}`),
  ].join(SEP);
  let html = l1;
  if (st.linea2) {
    html += "\n" + [
      seg("5h", `<span class="g">5h:</span>${barra(24)} <span class="g">↻2h23m</span>`),
      seg("7d", `<span class="g">7d:</span>${barra(61)} <span class="g">↻3d4h</span>`),
      seg("coste", `<span class="g">cost:</span>$1.37`),
    ].join(SEP);
  }
  el.innerHTML = html;
  if (efecto && !skipping) {
    el.classList.remove("flash", "nueva");
    void el.offsetWidth; // reinicia la animación CSS
    el.classList.add(efecto);
  }
}

async function status(cambios, efecto = "flash") {
  st = { ...(st || {}), ...cambios };
  pintarStatus(efecto);
  await sleep(900);
}

async function resaltar(segmentos) {
  for (const id of segmentos) {
    document.querySelectorAll(`[data-seg="${id}"]`).forEach((e) => e.classList.add("hl"));
    document.querySelectorAll(`[data-map="${id}"]`).forEach((e) => e.classList.add("hl"));
    await sleep(1300);
    document.querySelectorAll(".hl").forEach((e) => e.classList.remove("hl"));
  }
}

/* ============================================================
   3. El guion: escenas con su guía, sus notas y sus pasos
   ============================================================ */
const CODIGO_SCRIPT = [
  [null, 1, "// Status line: lee el JSON de la sesión por stdin y pinta una línea"],
  [null, 2, 'const { execSync } = require("child_process");'],
  [null, 3, 'const path = require("path");'],
  [null, 4, ""],
  [null, 5, 'let input = "";'],
  [null, 6, 'process.stdin.on("data", (c) => (input += c));'],
  [null, 7, 'process.stdin.on("end", () => {'],
  [null, 8, "  const d = JSON.parse(input);"],
  [null, 9, "  const carpeta = path.basename(d.workspace.current_dir);"],
  [null, 10, '  const rama = execSync("git branch --show-current").toString().trim();'],
  [null, 11, "  const pct = Math.round(d.context_window?.used_percentage ?? 0);"],
];

const DIFF_SETTINGS = [
  [null, 1, "{"],
  [null, 2, '  "permissions": { … },'],
  ["add", 3, '  "statusLine": {'],
  ["add", 4, '    "type": "command",'],
  ["add", 5, '    "command": "node C:/Users/joan/.claude/statusline.js"'],
  ["add", 6, "  }"],
  [null, 7, "}"],
];

const DIFF_LINEA2 = [
  [null, 31, "  const linea1 = [carpeta, rama, modelo, ctx].join(SEP);"],
  ["add", 32, "  const linea2 = ["],
  ["add", 33, '    ventana("5h", d.rate_limits?.five_hour),'],
  ["add", 34, '    ventana("7d", d.rate_limits?.seven_day),'],
  ["add", 35, "    `cost:$${d.cost.total_cost_usd.toFixed(2)}`,"],
  ["add", 36, "  ].filter(Boolean);"],
  ["del", 37, "  process.stdout.write(linea1);"],
  ["add", 37, '  process.stdout.write(linea1 + "\\n" + linea2.join(SEP));'],
];

const SCENES = [
  {
    step: "AI Lightning Talks with Claude",
    title: "Activando la <em>statusline bar</em> en Claude Cli",
    body: `<p>Esto es Claude Code en el terminal de VS Code.</p>
           <p>Fijaos en la parte de abajo: solo hay atajos de teclado. <b>Ninguna información de la sesión.</b></p>
           <p class="note">Joan · QA Tester</p>`,
    notes: "Hoy vengo a hablar de una línea. Literalmente, una: la de abajo. Ahora mismo está vacía.",
    beats: [async () => {
      add("welcome", `<b>✻</b> Welcome to <b>Claude Code</b>!\n\n<span class="muted">  /help for help, /status for your current setup\n\n  cwd: C:/Users/joan/Desktop/talks</span>`);
      await sleep(300);
    }],
  },
  {
    step: "01 · El problema",
    title: "Trabajar <em>a ciegas</em>",
    body: `<p>Le pido una tarea larga. Claude lee y edita archivos… y yo no sé:</p>
           <ul><li>¿Cuánto contexto llevo?</li><li>¿Cuánto me queda del límite de uso?</li>
           <li>¿En qué rama estoy?</li><li>¿Cuánto llevo gastado?</li></ul>
           <p>Hasta que aparece el aviso. Y ya es tarde.</p>`,
    notes: "Me pasaba esto: descubría que se acababa el contexto cuando ya era tarde. Deja que se vea el aviso amarillo.",
    beats: [async () => {
      await escribirPrompt("refactoriza el módulo de pagos y añade tests");
      await enviar();
      await pensar(1500);
      await herramienta("Read", "src/pagos/cobro.ts", "Read 214 lines");
      await herramienta("Update", "src/pagos/cobro.ts", "Updated with 38 additions and 12 removals");
      await herramienta("Write", "tests/cobro.test.ts", "Wrote 96 lines to tests/cobro.test.ts");
      add("warn", "⚠ Context low (9% remaining) · Run /compact to compact & continue");
      await sleep(500);
    }],
  },
  {
    step: "02 · El atajo",
    title: "Se lo pido <em>en lenguaje natural</em>",
    body: `<p>El comando <code>/statusline</code> acepta una descripción de lo que quieres ver.</p>
           <p>Claude Code escribe el script y lo configura por ti.</p>
           <p class="note">No hace falta saber programar para tener la tuya.</p>`,
    notes: "Escribe despacio, que lean el prompt. Es el momento clave: un comando y una frase.",
    beats: [async () => {
      await escribirPrompt("/statusline muestra la carpeta, la rama, el modelo y el contexto con una barra de colores", 28);
      await enviar();
    }],
  },
  {
    step: "03 · Lo que implementa",
    title: "Un script y <em>una línea de configuración</em>",
    body: `<div class="flow"><div>Claude Code<small>JSON · stdin</small></div><span>→</span><div class="you">tu script<small>statusline.js</small></div><span>→</span><div>la barra<small>texto · stdout</small></div></div>
           <ul><li><code>statusline.js</code>: lee el JSON que le pasa Claude Code e imprime una línea.</li>
           <li><code>settings.json</code>: le dice a Claude Code qué comando ejecutar.</li></ul>
           <p>No hay más magia: cualquier lenguaje que lea stdin y escriba stdout sirve.</p>`,
    notes: "Señala el diagrama mientras aparece el código. Después del settings.json, la barra aparece sola. Y lo primero que veo: estoy al 91 %, en rojo.",
    beats: [
      async () => {
        await pensar(1300);
        await dice("Voy a crear un script en Node que lea el JSON de la sesión y pinte la barra.");
        await herramienta("Write", "~/.claude/statusline.js", "Wrote 42 lines to ~/.claude/statusline.js", CODIGO_SCRIPT, "… +31 lines (ctrl+r to expand)");
      },
      async () => {
        await herramienta("Update", "~/.claude/settings.json", "Updated with 4 additions", DIFF_SETTINGS);
        await dice("Listo. La status line se actualizará con cada mensaje.");
        await status({ ctx: 91 }, "nueva");
      },
    ],
  },
  {
    step: "04 · Qué datos recibe",
    title: "Cada trozo sale <em>de un campo</em>",
    body: `<table class="map">
             <tr data-map="carpeta"><td>talks</td><td><code>workspace.current_dir</code></td></tr>
             <tr data-map="rama"><td>main</td><td><code>git branch</code>: no viene en el JSON, lo calcula el script</td></tr>
             <tr data-map="modelo"><td>Opus</td><td><code>model.display_name</code></td></tr>
             <tr data-map="ctx"><td>ctx 91%</td><td><code>context_window.used_percentage</code></td></tr>

/* ============================================================
   4. Navegación
   ============================================================ */
let escena = 0, paso = 0, ocupado = false;

function pintarGuia() {
  const s = SCENES[escena];
  const c = $("guideContent");
  c.innerHTML = `<div class="guide__step">${s.step}</div><h2>${s.title}</h2><div class="guide__body">${s.body}</div>`;
  c.classList.remove("guide__enter"); void c.offsetWidth; c.classList.add("guide__enter");
  $("notesText").textContent = s.notes;
  $("dots").innerHTML = SCENES.map((_, i) => `<i class="${i === escena ? "on" : i < escena ? "done" : ""}"></i>`).join("");
  history.replaceState(null, "", "#" + (escena + 1)); // no llena el historial
}

function pintarPista() {
  const h = $("nextHint");
  const fin = escena === SCENES.length - 1 && paso >= SCENES[escena].beats.length;
  h.textContent = ocupado ? "● animando… (→ para terminar)" : fin ? "fin" : "→ siguiente";
  h.classList.toggle("wait", ocupado);
}

async function ejecutar(beat) {
  ocupado = true; pintarPista();
  try { await beat(); }
  catch (e) { if (e !== ABORT) throw e; }
  finally { ocupado = false; pintarPista(); }
}

async function siguiente() {
  if (ocupado) { adelantar(); return; }
  if (paso >= SCENES[escena].beats.length) {
    if (escena === SCENES.length - 1) return;
    escena++; paso = 0; pintarGuia();
  }
  skipping = false;
  await ejecutar(SCENES[escena].beats[paso++]);
}

// Reconstruye la terminal hasta el final de la escena `n`, sin animaciones
async function irA(n) {
  gen++;
  pendientes.slice().forEach((f) => f());
  transcript.innerHTML = ""; $("inputText").textContent = ""; st = null; pintarStatus();
  skipping = true;
  for (let i = 0; i <= n; i++) {
    for (const beat of SCENES[i].beats) {
      try { await beat(); } catch (e) { if (e !== ABORT) throw e; }
    }
  }
  skipping = false;
  escena = n; paso = SCENES[n].beats.length; ocupado = false;
  pintarGuia(); pintarPista();
}

async function repetir() {
  // Vuelve al final de la escena anterior y reproduce esta con animación
  const n = escena;
  if (n === 0) return;
  await irA(n - 1);
  escena = n; paso = 0; pintarGuia();
  await siguiente();
}

document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowright", "pagedown", " "].includes(k)) { e.preventDefault(); siguiente(); }
  else if (["arrowleft", "pageup"].includes(k)) { e.preventDefault(); if (escena > 0) irA(escena - 1); }
  else if (k === "home") irA(0);
  else if (k === "end") irA(SCENES.length - 1);
  else if (k === "r") repetir();
  else if (k === "n") $("notes").hidden = !$("notes").hidden;
  else if (k === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
document.querySelector(".main").addEventListener("click", () => siguiente());

// Dentro del iframe de la página de la charla, el enlace "Volver" sobra
if (window.self !== window.top) $("backLink").hidden = true;

irA(Math.max(0, Math.min(SCENES.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
</script>
