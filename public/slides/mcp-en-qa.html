<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cómo trabajo con MCP en QA · Joan</title>
<!--
  Presentación animada de un solo archivo (sin dependencias).
  A la izquierda, una terminal de Claude Code donde se escriben los prompts y Claude usa
  los servidores MCP. A la derecha, la guía que explica cada paso.
  Todos los datos (Tienda Demo, DEMO-123, reglas de devoluciones…) son ficticios.

  Teclas: → / espacio / clic = siguiente paso (si hay una animación en marcha, la termina)
          ← = escena anterior · R = repetir escena · N = notas · F = pantalla completa
-->
<style>
:root {
  --bg: #1e1e1e; --term: #141414; --panel: #252526; --border: #3c3c3c;
  --text: #d4d4d4; --muted: #8b8b8b; --dim: #5a5a5a;
  --claude: #d97757; --blue: #569cd6; --cyan: #4ec9b0; --ok: #3fb950;
  --yellow: #d7ba7d; --red: #f14c4c; --magenta: #c586c0;
  --add-bg: rgba(63, 185, 80, .14);
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --ui: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
/* Todo escala con la ventana (proyector, portátil o iframe de la web) */
html { font-size: min(1.05vw, 1.87vh); }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--ui); overflow: hidden; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

/* --- Barra superior estilo VS Code --- */
.titlebar { display: flex; align-items: center; gap: 1rem; height: 2.4rem; padding: 0 1rem; background: #181818; border-bottom: 1px solid var(--border); font-size: .85rem; color: var(--muted); }
.titlebar svg { width: 1.1rem; height: 1.1rem; }
.titlebar__tabs { display: flex; gap: 1.5rem; font-family: var(--mono); font-size: .8rem; letter-spacing: .05em; }
.titlebar__tabs span.on { color: var(--text); border-bottom: 1px solid var(--text); padding-bottom: .1rem; }
.titlebar__title { flex: 1; text-align: center; }
.titlebar kbd { font-family: var(--mono); font-size: .7rem; border: 1px solid var(--border); border-radius: 3px; padding: 0 .3rem; margin-left: .25rem; }
.back { color: #fff; background: #0e639c; text-decoration: none; padding: .15rem .6rem; border-radius: 3px; }
.back:hover { background: #1177bb; }

.main { display: grid; grid-template-columns: 1.7fr 1fr; min-height: 0; }

/* --- Terminal de Claude Code --- */
.term { display: flex; flex-direction: column; min-height: 0; background: var(--term); border-right: 1px solid var(--border); font-family: var(--mono); font-size: 1rem; line-height: 1.55; }
/* flex-end: lo nuevo entra por abajo y lo viejo desaparece por arriba, como en una terminal */
.transcript { flex: 1; min-height: 0; overflow: hidden; padding: 1.2rem 1.6rem .6rem; display: flex; flex-direction: column; justify-content: flex-end; }
.transcript > * { flex-shrink: 0; }

.welcome { border: 1px solid var(--claude); border-radius: .4rem; padding: .7rem 1.1rem; margin-bottom: 1.2rem; width: fit-content; white-space: pre-wrap; }
.welcome b { color: var(--claude); }
.welcome .muted { color: var(--muted); }

.msg { margin: .5rem 0; white-space: pre-wrap; }
.msg-user { margin: .9rem 0 .5rem; padding: .25rem .7rem; background: #262626; color: var(--muted); white-space: pre-wrap; border-left: 2px solid var(--dim); }
.msg-user .t { color: var(--text); }
.msg-user.bash { border-left-color: var(--magenta); }
.msg-user.bash .t { color: var(--magenta); }
.dot { margin-right: .5rem; }
.dot--w { color: var(--text); } .dot--ok { color: var(--ok); }
.tool b { color: var(--text); }
.tool .mcp { color: var(--muted); }
.tool .arg { color: var(--muted); }
.result { color: var(--muted); margin: 0 0 .4rem 1.1rem; white-space: pre-wrap; }
.src { color: var(--cyan); }

.code { margin: .2rem 0 .4rem 1.1rem; border-left: 1px solid var(--border); padding-left: .8rem; font-size: .88rem; line-height: 1.5; }
.code div { white-space: pre; }
.code .ln { color: var(--dim); display: inline-block; width: 2.2rem; text-align: right; margin-right: .9rem; }
.code .add { background: var(--add-bg); color: #b9e6c0; }
.code .kw { color: var(--magenta); }

/* Panel de /mcp y aviso de permisos */
.box { border: 1px solid var(--dim); border-radius: .4rem; padding: .6rem 1rem; margin: .5rem 0; width: fit-content; min-width: 60%; white-space: pre-wrap; }
.box__title { color: var(--text); font-weight: 600; margin-bottom: .3rem; }
.box--perm { border-color: var(--yellow); }
.box--perm .box__title { color: var(--yellow); }
.opt.sel { color: var(--blue); }

.spinner { color: var(--claude); margin: .5rem 0; }
.spinner .muted { color: var(--muted); }

/* Caja de entrada */
.input { margin: 0 1.6rem; padding: .55rem 1rem; border: 1px solid var(--dim); border-radius: .4rem; min-height: 2.6rem; white-space: pre-wrap; }
.input::before { content: "> "; color: var(--text); }
.input.bash { border-color: var(--magenta); }
.input.bash::before { content: "! "; color: var(--magenta); }
.cursor { display: inline-block; width: .55rem; height: 1.05rem; background: var(--text); vertical-align: text-bottom; animation: parpadeo 1s steps(1) infinite; }
@keyframes parpadeo { 50% { opacity: 0; } }
.footer { padding: .45rem 2.4rem .9rem; min-height: 2.4rem; color: var(--muted); white-space: pre; }
.footer .mcp-on { color: var(--ok); }

.g { color: var(--muted); } .ve { color: var(--ok); } .am { color: var(--yellow); } .ro { color: var(--red); }

/* --- Panel de guía --- */
.guide { display: flex; flex-direction: column; padding: 2rem 2.2rem 1.4rem; background: var(--panel); min-height: 0; }
.guide__step { font-family: var(--mono); font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--claude); margin-bottom: .9rem; }
.guide__step::before { content: "── "; color: var(--dim); }
.guide h2 { font-size: 2.1rem; line-height: 1.15; margin: 0 0 1.1rem; font-weight: 600; }
.guide h2 em { font-style: normal; color: var(--claude); }
.guide__body { flex: 1; font-size: 1.15rem; line-height: 1.55; overflow: hidden; }
.guide__body p { margin: 0 0 1rem; }
.guide__body ul { margin: 0 0 1rem; padding-left: 1.2rem; }
.guide__body li { margin-bottom: .45rem; }
.guide__body code { font-family: var(--mono); font-size: .92em; color: var(--cyan); }
.guide__body .note { border-left: 3px solid var(--claude); padding: .5rem .9rem; background: rgba(217,119,87,.08); font-size: 1.05rem; }
.guide__body .quote { font-size: 1.45rem; line-height: 1.35; color: #fff; }
.guide__body .quote em { font-style: normal; color: var(--claude); }
.guide__enter { animation: entra .4s ease; }
@keyframes entra { from { opacity: 0; transform: translateX(.8rem); } to { opacity: 1; transform: none; } }

.hand { font-size: 4rem; line-height: 1; margin-bottom: 1rem; }
.flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: .4rem; margin: .3rem 0 1.2rem; text-align: center; font-size: .95rem; }
.flow div { background: #1b1b1b; border: 1px solid var(--border); border-radius: .4rem; padding: .55rem .3rem; }
.flow div.you { border-color: var(--claude); }
.flow span { color: var(--claude); }
.flow small { display: block; font-family: var(--mono); font-size: .75rem; color: var(--muted); }
.caps { display: grid; gap: .6rem; font-size: 1rem; }
.caps div { background: #1b1b1b; border: 1px solid var(--border); border-radius: .4rem; padding: .5rem .8rem; }
.caps b { color: #fff; }
.caps .si { color: var(--ok); } .caps .no { color: var(--red); }
.checks { list-style: none; padding: 0 !important; }
.checks li::before { content: "☐ "; color: var(--claude); }

.guide__foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; font-size: .8rem; color: var(--muted); }
.dots { display: flex; gap: .4rem; }
.dots i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--dim); }
.dots i.on { background: var(--claude); }
.dots i.done { background: var(--muted); }
.next-hint { font-family: var(--mono); }
.next-hint.wait { color: var(--claude); }

/* Notas del presentador (tecla N) */
.notes { position: fixed; left: 1rem; top: 3.2rem; width: 34rem; background: #111; border: 1px solid var(--yellow); border-radius: .4rem; padding: .9rem 1.1rem; font-size: 1rem; line-height: 1.5; z-index: 5; }
.notes b { display: block; font-family: var(--mono); font-size: .75rem; color: var(--yellow); letter-spacing: .1em; margin-bottom: .3rem; }
</style>
</head>

<div class="app">
  <header class="titlebar">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M76 8L96 18V82L76 92L32 56L14 70L4 64V36L14 30L32 44L76 8ZM76 28L46 50L76 72V28Z" fill="#007acc"/></svg>
    <a class="back" id="backLink" href="/charlas/mcp-en-qa/" target="_top">← Volver a la charla</a>
    <div class="titlebar__tabs"><span>PROBLEMS</span><span>OUTPUT</span><span class="on">TERMINAL</span></div>
    <span class="titlebar__title">claude — tienda-demo</span>
    <span><kbd>→</kbd> siguiente <kbd>←</kbd> anterior <kbd>R</kbd> repetir <kbd>N</kbd> notas <kbd>F</kbd> pantalla completa</span>
  </header>

  <div class="main">
    <section class="term">
      <div class="transcript" id="transcript"></div>

    </aside>

</div>
<div class="notes" id="notes" hidden><b>NOTAS DEL PRESENTADOR</b><span id="notesText"></span></div>

<script>
/* ============================================================
   1. Motor de animación
   - sleep() espera, salvo en "modo rápido" (skipping), que termina al instante.
   - Cambiar de escena incrementa `gen`: las animaciones viejas se cancelan.
   ============================================================ */
const ABORT = Symbol("abort");
let skipping = false;  // true = completar la animación actual sin esperas
let gen = 0;           // generación: cambia al saltar de escena
let pendientes = [];   // esperas en curso (para poder adelantarlas)

function sleep(ms) {
  const g = gen;
  if (skipping) return g === gen ? Promise.resolve() : Promise.reject(ABORT);
  return new Promise((resolve, reject) => {
    const done = () => {
      clearTimeout(t);
      pendientes = pendientes.filter((f) => f !== done);
      g === gen ? resolve() : reject(ABORT);
    };
    const t = setTimeout(done, ms);
    pendientes.push(done);
  });
}

function adelantar() {          // termina ya la animación en curso
  skipping = true;
  pendientes.slice().forEach((f) => f());
}

/* ============================================================
   2. Piezas de la terminal
   ============================================================ */
const $ = (id) => document.getElementById(id);
const transcript = $("transcript");
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function add(cls, html) {
  const e = document.createElement("div");
  e.className = cls;
  e.innerHTML = html;
  transcript.appendChild(e);
  return e;
}

// Los prompts que empiezan por "!" son comandos de terminal (modo bash de Claude Code)
async function escribirPrompt(texto, velocidad = 32) {
  const el = $("inputText");
  const bash = texto.startsWith("!");
  const visible = bash ? texto.slice(1).trimStart() : texto;
  $("input").classList.toggle("bash", bash);
  el.textContent = "";
  if (skipping) { el.textContent = visible; return; }
  for (const ch of visible) {
    el.textContent += ch;
    await sleep(velocidad + Math.random() * 25);
  }
  await sleep(450);
}

async function enviar() {
  const texto = $("inputText").textContent;
  const bash = $("input").classList.contains("bash");
  $("inputText").textContent = "";
  $("input").classList.remove("bash");
  add(bash ? "msg-user bash" : "msg-user", `${bash ? "!" : "&gt;"} <span class="t">${esc(texto)}</span>`);
  await sleep(350);
}

const FRAMES = ["·", "✢", "✳", "✶", "✻", "✽", "✻", "✶", "✳", "✢"];
async function pensar(ms, etiqueta = "Pensando…") {
  const e = add("spinner", "");
  const inicio = Date.now();
  let i = 0;
  try {
    while (!skipping && Date.now() - inicio < ms) {
      const seg = Math.floor((Date.now() - inicio) / 1000);
      e.innerHTML = `${FRAMES[i++ % FRAMES.length]} ${etiqueta} <span class="muted">(${seg}s · esc to interrupt)</span>`;
      await sleep(110);
    }
  } finally {
    e.remove();
  }
}

// Respuesta de Claude: las líneas aparecen una a una
async function dice(lineas) {
  const e = add("msg", `<span class="dot dot--w">●</span>`);
  for (let i = 0; i < lineas.length; i++) {
    e.innerHTML += (i ? "\n" : "") + lineas[i];
    await sleep(380);
  }
  await sleep(300);
}

// Llamada a una herramienta MCP: ● servidor - herramienta (MCP)(argumentos)
async function mcp(servidor, herramienta, args, resultado) {
  add("msg tool", `<span class="dot dot--ok">●</span><b>${servidor} - ${herramienta}</b> <span class="mcp">(MCP)</span><span class="arg">(${esc(args)})</span>`);
  await pensar(900, "Llamando a " + servidor + "…");
  add("result", `⎿  ${resultado}`);
  await sleep(500);
}

// Herramienta normal de Claude Code (Write, Bash…) con bloque de código opcional
async function herramienta(nombre, arg, resultado, lineas = null) {
  add("msg tool", `<span class="dot dot--ok">●</span><b>${nombre}</b><span class="arg">(${esc(arg)})</span>`);
  await sleep(400);
  if (lineas) {
    const bloque = add("code", "");
    for (const [num, html] of lineas) {
      const d = document.createElement("div");
      d.className = "add";
      d.innerHTML = `<span class="ln">${num}</span>+ ${html}`;
      bloque.appendChild(d);
      await sleep(90);
    }
  }
  add("result", `⎿  ${resultado}`);
  await sleep(600);
}

async function caja(titulo, filas, clase = "") {
  add(`box ${clase}`, `<div class="box__title">${titulo}</div>${filas.join("\n")}`);
  await sleep(700);
}

function pie(html) { $("footer").innerHTML = html; }
const PIE_INICIAL = "? for shortcuts";
const PIE_MCP = `? for shortcuts · <span class="mcp-on">● 2 MCP servers</span>`;

/* ============================================================
   3. El guion
   ============================================================ */
const PREGUNTA = "¿Cómo funcionan las devoluciones con vale en Tienda Demo?";

const FEATURE = [
  [1, `<span class="kw">Feature:</span> Cupón de fidelización sobre línea con promo`],
  [2, ""],
  [3, `  <span class="kw">Scenario:</span> Aplicar cupón del 10% sobre artículo en 2x1`],
  [4, `    <span class="kw">Given</span> el cliente tiene el cupón "FIDELIDAD10"`],
  [5, `    <span class="kw">And</span> el ticket contiene "Camiseta demo" con promo "2x1"`],
  [6, `    <span class="kw">When</span> aplica el cupón del 10%`],
  [7, `    <span class="kw">Then</span> el subtotal refleja ambos descuentos`],
  [8, `    <span class="kw">And</span> la devolución posterior recalcula correctamente`],
];

const SCENES = [
  {
    step: "Charla · IA aplicada a QA",
    title: "Cómo trabajo con <em>MCP</em> en QA",
    body: `<p>Diez minutos sobre conectar la IA al contexto real del proyecto: <b>Jira, Confluence y Figma</b>.</p>
           <p>Todo lo que vais a ver pasa en la terminal, con Claude Code.</p>
           <p class="note">Joan · QA Tester<br><span class="g">Datos de ejemplo: Tienda Demo (ficticia).</span></p>`,
    notes: "Buenas. Cómo trabajo con MCP en QA. Diez minutos, tres herramientas: Jira, Confluence y Figma.",
    beats: [async () => {
      pie(PIE_INICIAL);
      add("welcome", `<b>✻</b> Welcome to <b>Claude Code</b>!\n\n<span class="muted">  /help for help, /status for your current setup\n\n  cwd: C:/Users/joan/proyectos/tienda-demo</span>`);
      await sleep(300);
    }],
  },
  {
    step: "Pregunta a la sala",
    title: "Antes de empezar…",
    body: `<div class="hand">✋</div>
           <p class="quote">¿Quién usa <em>MCP</em> a diario?</p>
           <p class="quote">¿Y quién lo tiene conectado a <em>Jira o Confluence</em>?</p>`,
    notes: "Pausa real: espera a que levanten la mano. Si nadie, el resto se entiende mejor; si muchos, ve más rápido.",
    beats: [async () => { await sleep(200); }],
  },
  {
    step: "01 · Anti-demo",
    title: "La misma pregunta. <em>Sin contexto.</em>",
    body: `<p>Le pregunto por una regla de negocio de mi proyecto.</p>
           <p>El modelo es listo, pero <b>no ha visto nunca nuestra documentación</b>. Lo único que puede hacer es pedirme más información.</p>
           <p class="note">Sin MCP, el modelo está ciego. Y yo acabo copiando y pegando.</p>`,
    notes: "Fijaos en la respuesta: pide un contexto que nosotros ya tenemos. Inteligente pero ciego.",
    beats: [async () => {
      await escribirPrompt(PREGUNTA);
      await enviar();
      await pensar(1400);
      await dice([
        "Para responder con precisión necesitaría más contexto:",
        "  · ¿Cuál es la política de devoluciones de la tienda?",
        "  · ¿Los vales son físicos o electrónicos? ¿Caducan?",
        "  · ¿Puedes compartir la documentación interna?",
        `<span class="g">Sin acceso a la documentación de Tienda Demo, no puedo darte una respuesta específica.</span>`,
      ]);
    }],
  },
  {
    step: "02 · Qué es MCP",
    title: "El <em>USB-C</em> de los modelos",
    body: `<p><b>Model Context Protocol</b>: un estándar abierto para conectar cualquier IA con tus herramientas.</p>
           <div class="flow"><div class="you">Host<small>Claude Code</small></div><span>⇄</span><div>Cliente MCP<small>dentro del host</small></div><span>⇄</span><div>Servidor MCP<small>Atlassian · Figma</small></div></div>
           <p>Cada servidor expone <code>tools</code> (acciones), <code>resources</code> (datos) y <code>prompts</code> (plantillas).</p>
           <p class="note">El host puede ser Claude Code, VS Code con Copilot… El protocolo es el mismo.</p>`,
    notes: "Tres piezas: host, cliente y servidor. Añadir un servidor es una línea. Atlassian lo publica en remoto; Figma se arranca en local con npx.",
    beats: [
      async () => {
        await escribirPrompt("/mcp");
        await enviar();
        await caja("Manage MCP servers", [`<span class="g">No MCP servers configured.</span>`]);
      },
      async () => {
        await escribirPrompt("! claude mcp add --transport sse atlassian https://mcp.atlassian.com/v1/sse");
        await enviar();
        add("result", "⎿  Added SSE MCP server atlassian with URL: https://mcp.atlassian.com/v1/sse");
        await sleep(500);
        await escribirPrompt("! claude mcp add figma -- npx -y figma-mcp-server");
        await enviar();
        add("result", "⎿  Added stdio MCP server figma with command: npx -y figma-mcp-server");
        await sleep(500);
      },
    ],
  },
  {
    step: "03 · Mi setup",
    title: "Conectado, <em>con mis permisos</em>",
    body: `<ul><li><b>Atlassian</b>: Jira + Confluence.</li><li><b>Figma</b>: los diseños de la app.</li></ul>
           <p>La autenticación es <b>OAuth</b>: inicio sesión con mi cuenta.</p>
           <p class="note">El modelo <b>solo ve lo que mi cuenta ya puede ver</b>. No hay accesos nuevos.</p>`,
    notes: "OAuth es la clave para que esto sea aceptable en una empresa: el modelo respeta los permisos de tu cuenta.",
    beats: [async () => {
      await escribirPrompt("/mcp");
      await enviar();
      await caja("Manage MCP servers", [
        `<span class="opt sel">❯</span> atlassian  <span class="ve">✔ connected</span>  <span class="g">· OAuth</span>`,
        `  figma      <span class="ve">✔ connected</span>`,
      ]);
      pie(PIE_MCP);
    }],
  },
  {
    step: "04 · Anti-demo",
    title: "La misma pregunta. <em>Con contexto.</em>",
    body: `<p>Mismo modelo, misma pregunta. Ahora Claude <b>busca en Confluence</b> antes de responder.</p>
           <p>Y me devuelve <b>el enlace a la fuente</b>, para que pueda comprobarlo.</p>
           <p class="quote">El modelo no se ha vuelto más listo. <em>Ahora ve dónde trabajo.</em></p>`,
    notes: "Mismo modelo, misma pregunta. Señala la llamada MCP y la fuente al final. Todo es un ejemplo ficticio.",
    beats: [async () => {
      await escribirPrompt(PREGUNTA);
      await enviar();
      await pensar(900);
      await mcp("atlassian", "searchConfluenceUsingCql", "cql: \"text ~ 'devoluciones vale'\"", "Found 3 pages");
      await dice([
        "He encontrado <b>Guía de devoluciones</b> (ejemplo ficticio). Resumen:",
        "  · Aplica cuando el ticket original tiene más de 15 días",
        "  · Genera un vale electrónico con caducidad de 6 meses",
        "  · La diferencia queda como saldo en el vale",
        "  · Requiere aprobación del encargado",
        `<span class="src">Fuente: wiki.example.com/spaces/TD/guia-devoluciones</span>`,
      ]);
    }],
  },
  {
    step: "05 · Caso 1 · Jira",

/* ============================================================
   4. Navegación
   ============================================================ */
let escena = 0, paso = 0, ocupado = false;

function pintarGuia() {
  const s = SCENES[escena];
  const c = $("guideContent");
  c.innerHTML = `<div class="guide__step">${s.step}</div><h2>${s.title}</h2><div class="guide__body">${s.body}</div>`;
  c.classList.remove("guide__enter"); void c.offsetWidth; c.classList.add("guide__enter");
  $("notesText").textContent = s.notes;
  $("dots").innerHTML = SCENES.map((_, i) => `<i class="${i === escena ? "on" : i < escena ? "done" : ""}"></i>`).join("");
  history.replaceState(null, "", "#" + (escena + 1)); // no llena el historial
}

function pintarPista() {
  const h = $("nextHint");
  const fin = escena === SCENES.length - 1 && paso >= SCENES[escena].beats.length;
  h.textContent = ocupado ? "● animando… (→ para terminar)" : fin ? "fin" : "→ siguiente";
  h.classList.toggle("wait", ocupado);
}

async function ejecutar(beat) {
  ocupado = true; pintarPista();
  try { await beat(); }
  catch (e) { if (e !== ABORT) throw e; }
  finally { ocupado = false; pintarPista(); }
}

async function siguiente() {
  if (ocupado) { adelantar(); return; }
  if (paso >= SCENES[escena].beats.length) {
    if (escena === SCENES.length - 1) return;
    escena++; paso = 0; pintarGuia();
  }
  skipping = false;
  await ejecutar(SCENES[escena].beats[paso++]);
}

// Reconstruye la terminal hasta el final de la escena `n`, sin animaciones
async function irA(n) {
  gen++;
  pendientes.slice().forEach((f) => f());
  transcript.innerHTML = ""; $("inputText").textContent = ""; $("input").classList.remove("bash");
  skipping = true;
  for (let i = 0; i <= n; i++) {
    for (const beat of SCENES[i].beats) {
      try { await beat(); } catch (e) { if (e !== ABORT) throw e; }
    }
  }
  skipping = false;
  escena = n; paso = SCENES[n].beats.length; ocupado = false;
  pintarGuia(); pintarPista();
}

async function repetir() {
  // Vuelve al final de la escena anterior y reproduce esta con animación
  const n = escena;
  if (n === 0) return;
  await irA(n - 1);
  escena = n; paso = 0; pintarGuia();
  await siguiente();
}

document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowright", "pagedown", " "].includes(k)) { e.preventDefault(); siguiente(); }
  else if (["arrowleft", "pageup"].includes(k)) { e.preventDefault(); if (escena > 0) irA(escena - 1); }
  else if (k === "home") irA(0);
  else if (k === "end") irA(SCENES.length - 1);
  else if (k === "r") repetir();
  else if (k === "n") $("notes").hidden = !$("notes").hidden;
  else if (k === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
document.querySelector(".main").addEventListener("click", () => siguiente());

// Dentro del iframe de la página de la charla, el enlace "Volver" sobra
if (window.self !== window.top) $("backLink").hidden = true;

irA(Math.max(0, Math.min(SCENES.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1)));
</script>
